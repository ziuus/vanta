name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitor

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (compile check)
        run: python -m py_compile src/monitor/*.py src/monitor/screens/*.py src/monitor/components/*.py src/monitor/core/*.py

      - name: Run tests
        run: pytest tests/ -v
