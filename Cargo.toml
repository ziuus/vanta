[package]
name = "vanta"
version = "0.2.0"
edition = "2021"
description = "Aesthetic Rust TUI system dashboard — monitoring meets flex widgets"
authors = ["zius"]
license = "MIT"
repository = "https://github.com/ziuus/vanta"
readme = "README.md"
keywords = ["tui", "dashboard", "monitor", "ratatui", "system"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
sysinfo = "0.33"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = "0.4"
dbus = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
