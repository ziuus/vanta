# Vanta tmux configuration
# Tokyo Night theme

# Set prefix to Ctrl+a (optional, uncomment to use)
# set -g prefix C-a
# unbind C-b

# Enable mouse
set -g mouse on

# Set terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Start windows at 1
set -g base-index 1
setw -g pane-base-index 1

# Faster command sequencing
set -s escape-time 0

# History
set -g history-limit 50000

# Refresh status more often
set -g status-interval 1

# Focus events
set -g focus-events on

# Aggressive resize
setw -g aggressive-resize on

# Don't rename windows automatically
set -g allow-rename off

# === Tokyo Night Theme ===

# Status bar colors
set -g status-style bg=colour235,fg=colour223
set -g status-style bg=#1a1b26,fg=#a9b1d6

# Window status
setw -g window-status-style fg=colour244,bg=colour235
setw -g window-status-current-style fg=colour223,bg=colour239

# Pane borders
set -g pane-border-style fg=colour235
set -g pane-active-border-style fg=colour142

# Messages
set -g message-style fg=colour223,bg=colour239
set -g message-command-style fg=colour223,bg=colour239

# === Live Status Bar (CPU/RAM/Disk) ===
set -g @vanta_mode "focus"
set -g status-interval 2
set -g status-left "#[fg=#7aa2f7]#[bg=#1a1b26] ⌘ Vanta #[fg=#a9b1d6]• #[fg=#e0af68]#{@vanta_mode} "
set -g status-right "#[fg=#9ece6a]#(echo 'CPU:' $(top -bn1 | grep "Cpu(s)" | awk '{print $2}')) #[fg=#7dcfff]#(echo 'RAM:' $(free -h | awk '/^Mem/{print $3 "/" $2}')) #[fg=#bb9af7]#(echo 'DISK:' $(df -h / | awk 'NR==2{print $3 "/" $2}')) "
set -g status-right-length 100

# === Layout ===
# Windows are created by vanta-select script, not here

# === Keybinds ===

# btop - toggle on demand (not always running)
bind -n C-b run-shell "if tmux list-windows | grep -q '^btop:'; then tmux kill-window -t btop; else tmux new-window -d -n btop 'btop'; fi"

# Vanta core module toggles
bind -n C-v run-shell "tmux new-window -d -n cava 'cava'"
bind -n C-k run-shell "tmux new-window -d -n clock 'tty-clock -c -C 2'"
bind -n C-c run-shell "tmux new-window -d -n calendar 'cal -3'"
bind -n C-m run-shell "tmux new-window -d -n matrix 'cmatrix -C green'"
bind -n C-f run-shell "tmux new-window -d -n yazi 'yazi'"
bind -n C-t run-shell "tmux new-window -d -n text 'fortune -s | cowsay -f ghostbusters'"

# System modules
bind -n C-i run-shell "tmux new-window -d -n sysinfo 'fastfetch 2>/dev/null || neofetch'"
bind -n C-n run-shell "tmux new-window -d -n network 'bandwhich 2>/dev/null || iftop'"
bind -n C-d run-shell "tmux new-window -d -n disk 'df -h'"
bind -n C-x run-shell "tmux new-window -d -n container 'lazydocker 2>/dev/null || docker ps -a'"

# Aesthetic modules
bind -n C-p run-shell "tmux new-window -d -n pipes 'pipes.sh'"
bind -n C-o run-shell "tmux new-window -d -n quotes 'fortune -s | cowsay -f ghostbusters'"
bind -n C-e run-shell "tmux new-window -d -n weather 'curl -s wttr.in?format=3'"
bind -n C-a run-shell "tmux new-window -d -n splash 'lolcat ~/Projects/vanta/modules/splash.sh 2>/dev/null || bash ~/Projects/vanta/modules/splash.sh'"
bind -n C-g run-shell "if tmux list-windows | grep -q '^monitor:'; then tmux kill-window -t monitor; else tmux new-window -d -n monitor 'bash ~/Projects/vanta/modules/monitor.sh tui'; fi"

# Utility modules
bind -n M-m run-shell "tmux new-window -d -n music 'ncmpcpp'"
bind -n M-g run-shell "tmux new-window -d -n lazygit 'lazygit'"
bind -n M-n run-shell "tmux new-window -d -n notes 'cat ~/Projects/vanta/notes.txt'"

# Close pane/window
bind -n C-w kill-pane
bind -n C-q kill-window

# Pane navigation
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Resize panes
bind -n C-Up resize-pane -U 5
bind -n C-Down resize-pane -D 5
bind -n C-Left resize-pane -L 5
bind -n C-Right resize-pane -R 5

# Sync panes (optional)
bind -n C-s setw synchronize-panes

# Copy mode
bind -n C-[ copy-mode
bind -n C-] paste-buffer

# ========================================
# NOTE: Uncomment if using iterm2 + tmux
# ========================================
# set -g default-terminal "screen-256color"