# Vanta "Hacker Edition" Sample Configuration
# Copy this to ~/.config/vanta/config.toml to use it!

[ui]
theme = "hacker"       # Assuming you have a green/black theme
refresh_rate = 1.0
fps = 30
startup_mode = "dashboard"

# 1. Enable the Security extension
[extensions]
enabled = ["security"]

# 2. Configure the main dashboard layout
[dashboard]
layout = [
    ["system", "cpu", "memory", "network"],
    ["cve_feed", "clamav", "processes"]
]

# 3. Create an entirely custom page (Press '5' to access)
[[pages]]
name = "Deep Scan"
layout = [
    ["matrix", "cve_feed"],
    ["clamav", "network", "processes"]
]
