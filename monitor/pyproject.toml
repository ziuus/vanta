[project]
name = "vanta-monitor"
version = "0.4.0"
description = "Feature-rich system monitor — Textual TUI with color-coded panels, process manager, GPU support, and Flask web dashboard"
authors = [
  { name = "Noel Paul", email = "noelyt101@gmail.com" },
]
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console :: Curses",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]
dependencies = [
  "flask",
  "flask-cors",
  "psutil",
  "textual>=1.0.0",
  "rich",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
gpu = [
  "nvidia-ml-py",
]

[project.urls]
Homepage = "https://github.com/ziuus/vanta"
Repository = "https://github.com/ziuus/vanta"
"Bug Tracker" = "https://github.com/ziuus/vanta/issues"
Documentation = "https://github.com/ziuus/vanta/tree/main/monitor"

[project.scripts]
vmon = "monitor.__main__:main"
vtui = "monitor.__main__:run_tui"
vweb = "monitor.__main__:run_web"
vboth = "monitor.__main__:run_both"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
